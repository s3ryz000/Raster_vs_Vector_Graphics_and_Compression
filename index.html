<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raster &amp; Vector Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Raster &amp; Vector Academy</h1>
    <p>Learn how pictures are stored, scaled and compressed, one short lesson at a time.</p>

    <!-- Step 1: sign in with a name. The form sends it to path.html as ?name=... -->
    <form action="path.html" method="get">
      <label for="name">What should we call you?</label>
      <input type="text" id="name" name="name" required maxlength="30" autocomplete="given-name">
      <button type="submit" class="button">Start learning</button>
    </form>
  </main>
</body>
</html>
