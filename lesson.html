<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson · Raster &amp; Vector Academy</title>
  <meta name="description" content="A bite-sized lesson on raster and vector graphics.">

  <!-- Bootstrap 5 + Google Font (Nunito) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Custom styles: order matters (base → components → widgets → page) -->
  <link href="css/base/tokens.css" rel="stylesheet">
  <link href="css/base/typography.css" rel="stylesheet">
  <link href="css/components/navbar.css" rel="stylesheet">
  <link href="css/components/buttons.css" rel="stylesheet">
  <link href="css/components/lesson.css" rel="stylesheet">
  <link href="css/widgets/flowchart.css" rel="stylesheet">
  <link href="css/widgets/zoom-demo.css" rel="stylesheet">
  <link href="css/widgets/jpeg-demo.css" rel="stylesheet">
  <link href="css/widgets/synth.css" rel="stylesheet">
  <link href="css/widgets/quiz.css" rel="stylesheet">
  <link href="css/pages/lesson-player.css" rel="stylesheet">
  <link href="css/base/accessibility.css" rel="stylesheet">
</head>

<body class="lesson-page">
  <!-- ===================== Lesson bar: exit · progress · hearts ===================== -->
  <header class="lesson-bar sticky-top">
    <div class="container lesson-container d-flex align-items-center gap-3 py-3">
      <a href="path.html" class="lesson-close" id="closeLink" aria-label="Exit lesson and return to your path">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </a>
      <div class="progress flex-grow-1" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <span class="stat" title="Hearts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff4b4b" d="M12 21 3.5 12.8A5 5 0 0 1 12 6a5 5 0 0 1 8.5 6.8L12 21Z"/></svg>
        <span id="hearts">5</span><span class="visually-hidden"> hearts</span>
      </span>
    </div>
  </header>

  <!-- ===================== Current step (filled by js/pages/lesson.js) ===================== -->
  <main class="container lesson-container py-4 stage" id="stage">
    <p class="text-secondary">Loading lesson…</p>
  </main>

  <!-- ===================== Action bar: feedback + Continue / Check ===================== -->
  <footer class="action-bar">
    <div class="container lesson-container py-3">
      <div id="feedback" class="mb-2" aria-live="polite"></div>
      <div id="actions">
        <button class="btn btn-chunky w-100" type="button" id="actionBtn" disabled>Continue</button>
      </div>
    </div>
  </footer>

  <!-- App scripts: order matters (core → widgets → page). The page loads js/lessons/lesson-NN.js itself. -->
  <script src="js/core/data.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/widgets/flowchart.js"></script>
  <script src="js/widgets/zoom-demo.js"></script>
  <script src="js/widgets/jpeg-demo.js"></script>
  <script src="js/widgets/synth.js"></script>
  <script src="js/pages/lesson.js"></script>
</body>
</html>
